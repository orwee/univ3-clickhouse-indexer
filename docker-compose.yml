services:
  clickhouse:
    # Pinned to an exact LTS patch release, never :latest. See DECISIONS.md.
    image: clickhouse/clickhouse-server:26.3.33.24
    container_name: univ3-clickhouse
    restart: unless-stopped

    # Credentials come from a file outside the repo. On first start the image
    # entrypoint reads CLICKHOUSE_DB / CLICKHOUSE_USER / CLICKHOUSE_PASSWORD
    # and creates the database and the user.
    env_file:
      - ${CLICKHOUSE_ENV_FILE:-${HOME}/secrets/clickhouse.env}

    # Loopback only. Without the 127.0.0.1 prefix Docker publishes on 0.0.0.0
    # and bypasses ufw/iptables INPUT rules.
    ports:
      - "127.0.0.1:8123:8123" # HTTP interface (clickhouse-connect, dbt)
      - "127.0.0.1:9000:9000" # native protocol (clickhouse-client)

    volumes:
      - clickhouse_data:/var/lib/clickhouse

    mem_limit: 3g

    # Recommended by the image documentation: ClickHouse keeps many files open
    # (one set per data part) and the default limit is too low.
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

    # /ping needs no credentials. 127.0.0.1 rather than localhost, which can
    # resolve to ::1 inside the container.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  clickhouse_data:
