# Uniswap v3 pools to index. Filled in by hand; every address is checked
# against the chain before use. Nothing in this file is generated.
#
# Where the addresses come from: the three pools below were picked by
# filtering in the dashboard of Orwee's discovery engine (orwee.io). Orwee is
# multi-chain and multi-protocol, so nothing was assumed: each address was
# verified on Ethereum mainnet with scripts/verify_pools.py (eth_getCode,
# factory(), token0(), token1(), fee(), and symbol()/decimals() of each token).
# A pool is listed here only if its factory() is the official UniswapV3Factory.
# Evidence: docs/verification/pools-2026-09-18.json. Reasoning: DECISIONS.md #8.
#
# The fourth pool (USDC/WETH 0.05%) did not come from Orwee. Its address was
# never typed by anyone: it is what the official factory returns for
# getPool(USDC, WETH, 500), and it then went through the same checks.
# Evidence: docs/verification/pools-2026-09-19.json. Reasoning: DECISIONS.md #9.
#
# Schema (all fields required):
#
#   address    string  pool contract address, 0x + 40 hex chars, checksummed
#   token0     string  symbol of token0 (the token with the LOWER address)
#   token1     string  symbol of token1
#   decimals0  int     decimals of token0
#   decimals1  int     decimals of token1
#   fee        int     fee tier in hundredths of a bip: 100, 500, 3000 or 10000
#   label      string  human-readable name used in logs and reports
#
# Example (commented out on purpose, the address is a placeholder):
#
#   - address: "0xREPLACE_WITH_THE_POOL_ADDRESS"
#     token0: USDC
#     token1: WETH
#     decimals0: 6
#     decimals1: 18
#     fee: 500
#     label: "USDC/WETH 0.05%"

