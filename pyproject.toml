[project]
name = "univ3-clickhouse-indexer"
version = "0.1.0"
description = "Uniswap v3 Swap events -> ClickHouse -> dbt -> reconciliation"
readme = "README.md"
# 3.12 is the version every part of the planned stack (dbt-core, dbt-clickhouse,
# clickhouse-connect) declares support for. See DECISIONS.md.
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dotenv",
    "clickhouse-connect",
    "requests",
    "pyyaml",
]

[dependency-groups]
dbt = [
    "dbt-adapters==1.24.5",
    "dbt-clickhouse==1.10.3",
    "dbt-core>=1.12,<1.13",
]
dev = [
    "pycryptodome>=3.23.0",
    "pytest",
    "ruff",
]

# Application, not a library: nothing to build or publish. uv.lock pins the
# exact versions; the code is imported from src/ via the pytest pythonpath.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# S608: tests build SQL from their own throw-away database name, never from input.
"tests/*" = ["S101", "S105", "S106", "S608"]
# Measurement scripts build SQL out of table and column NAMES, which cannot be bound
# as parameters. Everything interpolated is a module constant or a value read back
# from the database itself, never outside input. Long lines are SQL text.
"scripts/schema_experiments.py" = ["S608", "E501"]
# Long lines are the SQL that breaks the throw-away data, kept on one line each to be readable.
"scripts/prove_dbt_tests_can_fail.py" = ["E501"]
# The only interpolated value is the table name, validated by clickhouse.qualified().
"src/univ3_indexer/loader.py" = ["S608"]
"src/univ3_indexer/mv.py" = ["S608"]
# Long lines are Markdown table rows; the only interpolated name is validated.
"src/univ3_indexer/reconcile.py" = ["E501", "S608"]
# Long lines are Markdown table rows.
"src/univ3_indexer/sanity.py" = ["E501"]
"scripts/check_sql_practice.py" = ["S608", "E501"]
"scripts/query_performance.py" = ["S608", "E501"]
"scripts/demo.py" = ["S608"]
