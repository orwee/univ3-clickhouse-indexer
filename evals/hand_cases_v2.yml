# === HARD: dates and calendars ==================================================================

- id: v2-h-dates-001
  kind: hand
  family: dates
  question: >-
    On which day of the week did the USDC/WETH 0.05% pool have its highest dollar volume between
    2026-08-10 and 2026-09-24? Answer with the name of the day.
  answer_type: label
  reference_sql: >-
    SELECT dateName('weekday', block_date) FROM fct_pool_daily
    WHERE pool_label = 'USDC/WETH 0.05%' AND block_date BETWEEN '2026-08-10' AND '2026-09-24'
    ORDER BY volume_usd DESC LIMIT 1
  notes: >-
    The answer is a weekday, derived from a date. Catches the date given in place of its name.

- id: v2-h-dates-002
  kind: hand
  family: dates
  question: >-
    What was the total dollar volume of all pools on Saturdays and Sundays between 2026-08-10
    and 2026-09-24, both days included? Answer in US dollars.
  answer_type: number
  unit: USD
  tolerance: sum
  reference_sql: >-
    SELECT sum(volume_usd) FROM fct_pool_daily
    WHERE block_date BETWEEN '2026-08-10' AND '2026-09-24' AND toDayOfWeek(block_date) IN (6, 7)
  notes: >-
    A filter on the day of the week, which the table does not hold as a column. Catches weekdays
    taken for the weekend.

- id: v2-h-dates-003
  kind: hand
  family: dates
  question: >-
    How many days after 2026-08-10 did it take for the USDC/WETH 0.01% pool to first have more
    than 100,000,000 US dollars of volume in a day? Answer with the number of days since
    2026-08-10, counting 2026-08-10 as day 0.
  answer_type: number
  unit: days
  tolerance: count
  reference_sql: >-
    SELECT dateDiff('day', toDate('2026-08-10'), min(block_date)) FROM fct_pool_daily
    WHERE pool_label = 'USDC/WETH 0.01%' AND block_date >= '2026-08-10' AND volume_usd > 100000000
  notes: >-
    A first date that passes a threshold, then a difference of dates. Catches the date given
    instead of the difference, and a count starting from 1.

- id: v2-h-dates-004
  kind: hand
  family: dates
  question: >-
    How many swaps did all the pools have in the calendar week that started on Monday
    2026-09-07 (Monday to Sunday)?
  answer_type: number
  unit: swaps
  tolerance: count
  reference_sql: >-
    SELECT sum(swaps) FROM fct_pool_daily WHERE block_date BETWEEN '2026-09-07' AND '2026-09-13'
  notes: >-
    A week named by its Monday. Catches a week of 2026-09-07 to 2026-09-14.

- id: v2-h-dates-005
  kind: hand
  family: dates
  question: >-
    Of the complete Monday-to-Sunday weeks from 2026-08-10 to 2026-09-20, which one had the highest
    total dollar volume across all pools? Answer with the date of its Monday.
  answer_type: date
  reference_sql: >-
    SELECT toMonday(block_date) FROM fct_pool_daily
    WHERE block_date BETWEEN '2026-08-10' AND '2026-09-20'
    GROUP BY toMonday(block_date) ORDER BY sum(volume_usd) DESC LIMIT 1
  notes: >-
    A weekly aggregate of a daily table, answered with the start of the week. Catches the
    peak day, and a week that starts on another day.

- id: v2-h-dates-006
  kind: hand
  family: dates
  question: >-
    For how many calendar days does the daily table hold data, counting the first and the last
    day?
  answer_type: number
