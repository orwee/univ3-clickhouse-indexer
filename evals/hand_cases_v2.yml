# === HARD: lists in order =======================================================================

- id: v2-h-list-001
  kind: hand
  family: list
  question: >-
    List the four pools from the one with the most dollar volume to the one with the least,
    between 2026-09-01 and 2026-09-24, both days included. Give the labels.
  answer_type: list
  reference_sql: >-
    SELECT pool_label FROM fct_pool_daily
    WHERE block_date BETWEEN '2026-09-01' AND '2026-09-24'
    GROUP BY pool_label ORDER BY sum(volume_usd) DESC
  notes: >-
    A ranking of all four, in order. Catches the right pools in the wrong order.

- id: v2-h-list-002
  kind: hand
  family: list
  question: >-
