    and 2026-09-24, both included? Give the dates, the day with the most first.
  answer_type: list
  reference_sql: >-
    SELECT block_date FROM fct_pool_daily
    WHERE block_date BETWEEN '2026-08-10' AND '2026-09-24'
    GROUP BY block_date ORDER BY sum(swaps) DESC LIMIT 3
  notes: >-
    A sum over pools per day and then a top three. Catches the three biggest days of one pool.

- id: v2-h-list-006
  kind: hand
  family: list
  question: >-
    Rank the four pools by the share of their dollar volume that was round trips between
    2026-09-01 and 2026-09-24, both days included, from the highest share to the lowest. Give
