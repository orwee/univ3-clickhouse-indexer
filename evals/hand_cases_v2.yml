# Golden set v2, cases written by hand: sixty hard ones and eighty with no answer.
#
# Nothing in this file is an answer. A case with an answer holds a question and the query
# that answers it; `make golden-v2` runs the query on the fixture and stores what came back.
# `accepted_sql` holds a query for each other reasonable reading of the question. A file that
# carries `expected` is refused. A case with no answer has no query, and its `notes` say what
# a wrong answer would look like.
#
# The data, for whoever reads the queries: four pools (USDC/WETH 0.05% and 0.01%,
# wstETH/USDC 0.05% and 0.3%); days 2026-08-09 to 2026-09-25, of which the first and the last
# are partial, so the complete days are 2026-08-10 to 2026-09-24. Four pool-days have no row
# because the pool had no swap: wstETH/USDC 0.3% on 2026-08-09, 2026-08-15 and 2026-09-25,
# and wstETH/USDC 0.05% on 2026-09-25. token0 is USDC in the USDC/WETH pools and wstETH in the
# wstETH/USDC pools. `fee` is in hundredths of a basis point. The smart-money table has no
# rows in the fixture.
#
# v2 differs from v1 in what it asks: the questions here need a join, two queries, a unit
# conversion or a careful reading of a day that is partial or absent, and the questions with
# no answer are near misses, not far ones. Ten families of six hard cases, ten of eight cases
# with no answer.

# === HARD: several steps =========================================================================

- id: v2-h-multi-step-001
  kind: hand
  family: multi-step
  question: >-
    Of the two USDC/WETH fee tiers, which one had the larger average swap, in dollars, between
    2026-09-01 and 2026-09-24, both days included? Answer with the pool's label.
  answer_type: label
  reference_sql: >-
    SELECT pool_label FROM fct_pool_daily
    WHERE block_date BETWEEN '2026-09-01' AND '2026-09-24'
      AND pool_address IN (SELECT pool_address FROM dim_pools WHERE token0 = 'USDC' AND token1 = 'WETH')
    GROUP BY pool_label ORDER BY sum(volume_usd) / sum(swaps) DESC LIMIT 1
  notes: >-
    A filter on the pair, a ratio of two sums per tier, a maximum. The tier with more volume is
    not necessarily the one with the larger swaps. Catches a model that answers with the
    bigger tier, and one that compares an average of daily averages.

- id: v2-h-multi-step-002
  kind: hand
  family: multi-step
  question: >-
    On how many days from 2026-09-01 to 2026-09-24, both included, did the USDC/WETH 0.01% pool
    have more dollar volume than the USDC/WETH 0.05% pool?
  answer_type: number
  unit: days
  tolerance: count
  reference_sql: >-
    SELECT count() FROM (
      SELECT block_date,
             sumIf(volume_usd, pool_label = 'USDC/WETH 0.01%') AS tight,
             sumIf(volume_usd, pool_label = 'USDC/WETH 0.05%') AS wide
      FROM fct_pool_daily
      WHERE block_date BETWEEN '2026-09-01' AND '2026-09-24'
      GROUP BY block_date) WHERE tight > wide
  notes: >-
    Two series compared day by day and the days counted. Catches a comparison of the two
    totals, which answers 0 or 24, and a count of rows.

- id: v2-h-multi-step-003
  kind: hand
  family: multi-step
  question: >-
    Adding up all four pools, on which day between 2026-08-10 and 2026-09-24 was the dollar
    volume highest? Answer with the date.
  answer_type: date
  reference_sql: >-
    SELECT block_date FROM fct_pool_daily
    WHERE block_date BETWEEN '2026-08-10' AND '2026-09-24'
    GROUP BY block_date ORDER BY sum(volume_usd) DESC LIMIT 1
  notes: >-
    A sum over pools per day, then a maximum over days. Catches the peak day of one pool, which
    is not necessarily the peak of the total.

- id: v2-h-multi-step-004
  kind: hand
  family: multi-step
  question: >-
    Between 2026-08-10 and 2026-09-24, both days included, how many pool-days (a pool on a
    day) had more than 1,000,000 US dollars of volume?
  answer_type: number
  unit: pool-days
  tolerance: count
  reference_sql: >-
    SELECT count() FROM fct_pool_daily
    WHERE block_date BETWEEN '2026-08-10' AND '2026-09-24' AND volume_usd > 1000000
  notes: >-
    A count of rows of the daily table over all pools. Catches a count of days, or of pools,
    in place of pool-days.

- id: v2-h-multi-step-005
  kind: hand
  family: multi-step
  question: >-
    On how many days from 2026-08-10 to 2026-09-24, both included, was the USDC/WETH 0.05% pool
    the pool with the highest dollar volume of the four?
  answer_type: number
  unit: days
  tolerance: count
  reference_sql: >-
    SELECT countIf(top = 'USDC/WETH 0.05%') FROM (
      SELECT block_date, argMax(pool_label, volume_usd) AS top
      FROM fct_pool_daily
      WHERE block_date BETWEEN '2026-08-10' AND '2026-09-24'
      GROUP BY block_date)
  notes: >-
    A winner per day, then a count of the days one pool won. Catches a model that counts the
    days the pool has a row, and one that answers with a percentage.

- id: v2-h-multi-step-006
  kind: hand
  family: multi-step
  question: >-
    How many more swaps did all the pools together have in the week from 2026-09-14 to
    2026-09-20 than in the week from 2026-09-07 to 2026-09-13? Answer with the difference, negative if
    the later week had fewer.
  answer_type: number
  unit: swaps
  tolerance: count
  reference_sql: >-
    SELECT sumIf(swaps, block_date BETWEEN '2026-09-14' AND '2026-09-20')
         - sumIf(swaps, block_date BETWEEN '2026-09-07' AND '2026-09-13')
    FROM fct_pool_daily WHERE block_date BETWEEN '2026-09-07' AND '2026-09-20'
  notes: >-
    Two periods and a signed difference. Catches a difference taken the wrong way round and a
    percentage given in place of a count.

# === HARD: units =================================================================================

- id: v2-h-units-001
  kind: hand
  family: units
  question: >-
    What were the estimated fees of the USDC/WETH 0.05% pool from 2026-08-10 to 2026-08-31, both
    days included, in millions of US dollars?
  answer_type: number
  unit: million USD
  tolerance: {abs: "0", rel: "0.001"}
  reference_sql: >-
    SELECT sum(fees_usd) / 1000000 FROM fct_pool_daily
    WHERE pool_label = 'USDC/WETH 0.05%' AND block_date BETWEEN '2026-08-10' AND '2026-08-31'
  notes: >-
    The unit is millions, not dollars. Catches the figure in dollars. The tolerance is relative
    only, as for any amount that has no cent of its own.

- id: v2-h-units-002
  kind: hand
  family: units
  question: >-
    What was the average swap in the USDC/WETH 0.01% pool on 2026-09-10, in thousands of US
    dollars per swap?
  answer_type: number
  unit: thousand USD per swap
  tolerance: ratio
  reference_sql: >-
    SELECT sum(volume_usd) / sum(swaps) / 1000 FROM fct_pool_daily
    WHERE pool_label = 'USDC/WETH 0.01%' AND block_date = '2026-09-10'
  notes: >-
    A ratio and a change of unit in one question. Catches a figure in dollars.

- id: v2-h-units-003
  kind: hand
  family: units
  question: >-
    On 2026-09-03, the pool with the most swaps was charging what fee, in basis points?
  answer_type: number
  unit: basis points
  tolerance: ratio
  reference_sql: >-
    SELECT p.fee / 100 FROM fct_pool_daily AS d
    INNER JOIN dim_pools AS p ON p.pool_address = d.pool_address
    WHERE d.block_date = '2026-09-03' ORDER BY d.swaps DESC LIMIT 1
  notes: >-
    A maximum, a join to the pool table for the fee, and a unit: the column is in hundredths of
    a basis point. Catches the raw column, which is 100 times too large.

- id: v2-h-units-004
  kind: hand
  family: units
  question: >-
    How much USDC was traded across all four pools together on 2026-09-16? Answer in USDC, not
    in dollars of another token.
  answer_type: number
  unit: USDC
  tolerance: quantity
  reference_sql: >-
    SELECT sum(if(p.token0 = 'USDC', d.volume_token0, d.volume_token1))
    FROM fct_pool_daily AS d INNER JOIN dim_pools AS p ON p.pool_address = d.pool_address
    WHERE d.block_date = '2026-09-16'
  notes: >-
    USDC is token0 in the USDC/WETH pools and token1 in the wstETH/USDC pools, so the column
    to add up depends on the pool. Catches a sum of one column over all pools.

- id: v2-h-units-005
  kind: hand
  family: units
  question: >-
    How many thousand WETH were traded in the USDC/WETH 0.05% pool from 2026-09-14 to 2026-09-20,
    both days included?
  answer_type: number
  unit: thousand WETH
  tolerance: {abs: "0", rel: "0.001"}
  reference_sql: >-
    SELECT sum(volume_token1) / 1000 FROM fct_pool_daily
    WHERE pool_label = 'USDC/WETH 0.05%' AND block_date BETWEEN '2026-09-14' AND '2026-09-20'
  notes: >-
    WETH is token1 in this pool, and the unit is thousands. Catches the dollar figure and the
    unscaled token amount.

- id: v2-h-units-006
  kind: hand
  family: units
  question: >-
    On average, how many US cents of estimated fees did one swap in the USDC/WETH 0.01% pool
    pay on 2026-08-20? Answer in cents per swap.
  answer_type: number
  unit: cents per swap
  tolerance: ratio
  reference_sql: >-
    SELECT 100 * fees_usd / swaps FROM fct_pool_daily
    WHERE pool_label = 'USDC/WETH 0.01%' AND block_date = '2026-08-20'
  notes: >-
    A ratio of two columns and dollars turned into cents. Catches dollars per swap.

# === HARD: gross against net ====================================================================

- id: v2-h-gross-net-001
  kind: hand
  family: gross-net
  question: >-
    What was the net dollar volume of all four pools together on 2026-09-10, that is, the volume
    left after taking out round trips? Answer in US dollars.
  answer_type: number
  unit: USD
  tolerance: sum
  reference_sql: >-
    SELECT sum(net_volume_usd) FROM fct_pool_daily_round_trips WHERE block_date = '2026-09-10'
  notes: >-
    Net volume lives in the round-trips table, not in the daily one. Catches the gross figure.

- id: v2-h-gross-net-002
  kind: hand
  family: gross-net
  question: >-
    On 2026-09-02, which pool had the highest share of its volume made of round trips? Answer
    with the pool's label.
  answer_type: label
  reference_sql: >-
    SELECT pool_label FROM fct_pool_daily_round_trips
    WHERE block_date = '2026-09-02' ORDER BY round_trip_share_of_volume_usd DESC LIMIT 1
  notes: >-
    A share, not an amount: the pool with the most round-trip dollars is not necessarily the one
    with the highest share. Catches an answer by amount.

- id: v2-h-gross-net-003
  kind: hand
  family: gross-net
  question: >-
    By how many US dollars did the gross volume of the USDC/WETH 0.01% pool exceed its net volume
    (volume without round trips) from 2026-08-17 to 2026-08-23, both days included?
  answer_type: number
  unit: USD
  tolerance: sum
  reference_sql: >-
    SELECT sum(volume_usd) - sum(net_volume_usd) FROM fct_pool_daily_round_trips
    WHERE pool_label = 'USDC/WETH 0.01%' AND block_date BETWEEN '2026-08-17' AND '2026-08-23'
  notes: >-
    The difference of gross and net is the round-trip volume. Catches the net figure, and a
    percentage.

- id: v2-h-gross-net-004
  kind: hand
  family: gross-net
  question: >-
    What percent of the total dollar volume of all pools from 2026-09-01 to 2026-09-24, both days
    included, was round trips? Answer in percent of the whole volume of the period.
  answer_type: number
  unit: percent
  tolerance: ratio
  reference_sql: >-
    SELECT 100 * sum(round_trip_volume_usd) / sum(volume_usd) FROM fct_pool_daily_round_trips
    WHERE block_date BETWEEN '2026-09-01' AND '2026-09-24'
  notes: >-
    A ratio of sums over all pools. Catches an average of the four pools' daily shares, which
    weights a pool of a few dollars like one of hundreds of millions.

- id: v2-h-gross-net-005
  kind: hand
  family: gross-net
  question: >-
    How many round-trip swaps happened inside a single transaction, across all pools, from
    2026-09-01 to 2026-09-24, both days included?
  answer_type: number
  unit: swaps
  tolerance: count
  reference_sql: >-
    SELECT sum(round_trip_swaps_in_one_transaction) FROM fct_pool_daily_round_trips
    WHERE block_date BETWEEN '2026-09-01' AND '2026-09-24'
  notes: >-
    One column of the round-trips table, picked among five that sound alike. Catches
    round_trip_swaps and round_trips.

- id: v2-h-gross-net-006
  kind: hand
  family: gross-net
  question: >-
    On how many days from 2026-08-10 to 2026-09-24, both included, was the net volume of the
    USDC/WETH 0.05% pool below 99% of its gross volume?
  answer_type: number
  unit: days
  tolerance: count
  reference_sql: >-
    SELECT countIf(net_volume_usd < 0.99 * volume_usd) FROM fct_pool_daily_round_trips
    WHERE pool_label = 'USDC/WETH 0.05%' AND block_date BETWEEN '2026-08-10' AND '2026-09-24'
  notes: >-
    A condition between two columns of the same row, then a count of days. Catches a count over
    the whole period or a comparison of the totals.

# === HARD: partial days =========================================================================

- id: v2-h-partial-day-001
  kind: hand
  family: partial-day
  question: >-
    How many swaps did all the pools together have on 2026-09-25, according to the data?
  answer_type: number
  unit: swaps
  tolerance: count
  reference_sql: >-
    SELECT sum(swaps) FROM fct_pool_daily WHERE block_date = '2026-09-25'
  notes: >-
    The last day of the data holds part of a day and only two pools have a row. The right
    answer is the figure the data holds, with a caveat at most. Wrong answer: a refusal because
    the day is partial, or a figure from 2026-09-24.

- id: v2-h-partial-day-002
  kind: hand
  family: partial-day
  question: >-
    What was the combined dollar volume of all the pools on 2026-08-09, the first day of the
    data? Answer in US dollars.
  answer_type: number
  unit: USD
  tolerance: sum
  reference_sql: >-
    SELECT sum(volume_usd) FROM fct_pool_daily WHERE block_date = '2026-08-09'
  notes: >-
    The first day holds part of a day, and one pool has no row. Wrong answer: a refusal, or the
    figure of 2026-08-10.

- id: v2-h-partial-day-003
  kind: hand
  family: partial-day
  question: >-
    Which pool had the most swaps on 2026-09-25? Answer with the pool's label.
  answer_type: label
  reference_sql: >-
    SELECT pool_label FROM fct_pool_daily WHERE block_date = '2026-09-25'
    ORDER BY swaps DESC LIMIT 1
  notes: >-
    Only two of the four pools have a row on the last day. The maximum is among those that do.
    Wrong answer: a refusal, or a pool with no row on that day.

- id: v2-h-partial-day-004
  kind: hand
  family: partial-day
  question: >-
    The dollar volume of the USDC/WETH 0.05% pool on 2026-09-25 was what percent of its volume
    on 2026-09-24? Answer in percent.
  answer_type: number
  unit: percent
  tolerance: ratio
  reference_sql: >-
    SELECT 100 * sumIf(volume_usd, block_date = '2026-09-25') / sumIf(volume_usd, block_date = '2026-09-24')
    FROM fct_pool_daily
    WHERE pool_label = 'USDC/WETH 0.05%' AND block_date IN ('2026-09-24', '2026-09-25')
  notes: >-
    A partial day over a complete day, which is a small share because the day is cut short.
    Wrong answer: a refusal, or the percent change instead of the ratio.

- id: v2-h-partial-day-005
  kind: hand
  family: partial-day
  question: >-
    How many of the four pools have a row on 2026-09-25 in the daily table?
  answer_type: number
  unit: pools
  tolerance: count
  reference_sql: >-
    SELECT uniqExact(pool_address) FROM fct_pool_daily WHERE block_date = '2026-09-25'
  notes: >-
    The two wstETH/USDC pools had no swap on the last day. Wrong answer: 4, from the pool table,
    and a refusal.

- id: v2-h-partial-day-006
  kind: hand
  family: partial-day
  question: >-
    How many of the four pools recorded at least one swap on 2026-08-09?
  answer_type: number
  unit: pools
  tolerance: count
  reference_sql: >-
    SELECT uniqExact(pool_address) FROM fct_pool_daily WHERE block_date = '2026-08-09' AND swaps > 0
  notes: >-
    wstETH/USDC 0.3% has no row on the first day. Wrong answer: 4, or a refusal.

# === HARD: pool-days without a row ==============================================================

- id: v2-h-missing-pool-day-001
  kind: hand
  family: missing-pool-day
  question: >-
    On how many days from 2026-08-10 to 2026-09-24, both included, did the wstETH/USDC 0.3% pool
    have no swaps at all?
  answer_type: number
  unit: days
  tolerance: count
  reference_sql: >-
    SELECT dateDiff('day', toDate('2026-08-10'), toDate('2026-09-24')) + 1 - uniqExact(block_date)
    FROM fct_pool_daily
    WHERE pool_label = 'wstETH/USDC 0.3%' AND block_date BETWEEN '2026-08-10' AND '2026-09-24'
  notes: >-
    A day without a swap is a day without a row, so the days to count are the ones missing.
    Wrong answer: 0, from a query that looks for rows with zero swaps, and a refusal.

- id: v2-h-missing-pool-day-002
  kind: hand
  family: missing-pool-day
  question: >-
    How many swaps did the wstETH/USDC 0.3% pool have in the week from 2026-08-12 to 2026-08-18,
    both days included?
  answer_type: number
  unit: swaps
  tolerance: count
  reference_sql: >-
    SELECT sum(swaps) FROM fct_pool_daily
    WHERE pool_label = 'wstETH/USDC 0.3%' AND block_date BETWEEN '2026-08-12' AND '2026-08-18'
  notes: >-
    The week holds a day with no row, 2026-08-15, which adds nothing. Wrong answer: a refusal
    because a day is missing.

- id: v2-h-missing-pool-day-003
  kind: hand
  family: missing-pool-day
  question: >-
    Counting 2026-08-15 as a day with zero swaps, how many swaps per calendar day did the
    wstETH/USDC 0.3% pool have on average from 2026-08-12 to 2026-08-18, both days included?
  answer_type: number
  unit: swaps per day
  tolerance: ratio
  reference_sql: >-
    SELECT sum(swaps) / 7 FROM fct_pool_daily
    WHERE pool_label = 'wstETH/USDC 0.3%' AND block_date BETWEEN '2026-08-12' AND '2026-08-18'
  notes: >-
    The divisor is 7 calendar days, not the six rows. Wrong answer: the sum divided by 6.

- id: v2-h-missing-pool-day-004
  kind: hand
  family: missing-pool-day
  question: >-
    What was the combined dollar volume of all the pools on 2026-08-15? Answer in US dollars.
  answer_type: number
  unit: USD
  tolerance: sum
  reference_sql: >-
    SELECT sum(volume_usd) FROM fct_pool_daily WHERE block_date = '2026-08-15'
  notes: >-
    One of the four pools has no row that day. The total is that of the other three. Wrong
    answer: a refusal because a pool is missing.

- id: v2-h-missing-pool-day-005
  kind: hand
  family: missing-pool-day
  question: >-
    How many of the four pools had no swap at all on 2026-08-15?
  answer_type: number
  unit: pools
  tolerance: count
  reference_sql: >-
    SELECT (SELECT count() FROM dim_pools) - uniqExact(pool_address)
    FROM fct_pool_daily WHERE block_date = '2026-08-15'
  notes: >-
    The answer is the pools of the pool table that are absent from the daily table that day.
    Wrong answer: 0, from counting rows with swaps equal to zero.

- id: v2-h-missing-pool-day-006
  kind: hand
  family: missing-pool-day
  question: >-
    By how many US dollars did the daily volume of the wstETH/USDC 0.3% pool change from
    2026-08-14 to 2026-08-15? Give the change in USD, negative if it fell.
  answer_type: number
  unit: USD
  tolerance: {abs: "0", rel: "0.001"}
  reference_sql: >-
    SELECT ifNull(sumIf(volume_usd, block_date = '2026-08-15'), 0) - sumIf(volume_usd, block_date = '2026-08-14')
    FROM fct_pool_daily
    WHERE pool_label = 'wstETH/USDC 0.3%' AND block_date IN ('2026-08-14', '2026-08-15')
  notes: >-
    The second day has no row, so its volume is 0 and the change is minus the first day's
    volume. Wrong answer: a refusal, or a change of 0.

# === HARD: more than one reasonable reading ======================================================

- id: v2-h-ambiguous-001
  kind: hand
  family: ambiguous
  question: >-
    What share of the dollar volume of the USDC/WETH pair went through the 0.01% pool between
    2026-09-01 and 2026-09-07? Answer in percent.
  answer_type: number
  unit: percent
  tolerance: ratio
  reference_sql: >-
    SELECT 100 * sumIf(volume_usd, pool_label = 'USDC/WETH 0.01%') / sum(volume_usd)
    FROM fct_pool_daily
    WHERE block_date BETWEEN '2026-09-01' AND '2026-09-07'
      AND pool_address IN (SELECT pool_address FROM dim_pools WHERE token0 = 'USDC' AND token1 = 'WETH')
  accepted_sql:
    - >-
      SELECT avg(share) FROM (
        SELECT block_date, 100 * sumIf(volume_usd, pool_label = 'USDC/WETH 0.01%') / sum(volume_usd) AS share
        FROM fct_pool_daily
        WHERE block_date BETWEEN '2026-09-01' AND '2026-09-07'
          AND pool_address IN (SELECT pool_address FROM dim_pools WHERE token0 = 'USDC' AND token1 = 'WETH')
        GROUP BY block_date)
  notes: >-
    The share of the week's volume, or the mean of the seven daily shares. Both are reasonable;
    the first is the reference and the second is accepted.

- id: v2-h-ambiguous-002
  kind: hand
  family: ambiguous
  question: >-
    What was the average daily dollar volume of the wstETH/USDC 0.3% pool from 2026-08-12 to
    2026-08-18? Answer in US dollars per day.
  answer_type: number
  unit: USD per day
  tolerance: ratio
  reference_sql: >-
    SELECT sum(volume_usd) / 7 FROM fct_pool_daily
    WHERE pool_label = 'wstETH/USDC 0.3%' AND block_date BETWEEN '2026-08-12' AND '2026-08-18'
  accepted_sql:
    - >-
      SELECT avg(volume_usd) FROM fct_pool_daily
      WHERE pool_label = 'wstETH/USDC 0.3%' AND block_date BETWEEN '2026-08-12' AND '2026-08-18'
  notes: >-
    The week has seven days and six rows. Over the seven calendar days is the reference; over
    the six days that have a row is also accepted.

- id: v2-h-ambiguous-003
  kind: hand
  family: ambiguous
  question: >-
    Which pool was the most active between 2026-09-01 and 2026-09-24, both days included?
    Answer with the pool's label.
  answer_type: label
  reference_sql: >-
    SELECT pool_label FROM fct_pool_daily
    WHERE block_date BETWEEN '2026-09-01' AND '2026-09-24'
    GROUP BY pool_label ORDER BY sum(swaps) DESC LIMIT 1
  accepted_sql:
    - >-
      SELECT pool_label FROM fct_pool_daily
      WHERE block_date BETWEEN '2026-09-01' AND '2026-09-24'
      GROUP BY pool_label ORDER BY sum(volume_usd) DESC LIMIT 1
  notes: >-
    Active by swaps or by dollars. The swaps are the reference; the dollars are accepted when
    they name another pool.

- id: v2-h-ambiguous-004
  kind: hand
  family: ambiguous
  question: >-
    What was a typical daily dollar volume of the USDC/WETH 0.05% pool from 2026-09-01 to
    2026-09-24? Answer in US dollars.
  answer_type: number
  unit: USD
