    2026-08-10 and 2026-09-24, both included? Give the dates, the highest first.
  answer_type: list
  reference_sql: >-
    SELECT block_date FROM fct_pool_daily
    WHERE pool_label = 'USDC/WETH 0.05%' AND block_date BETWEEN '2026-08-10' AND '2026-09-24'
    ORDER BY volume_usd DESC LIMIT 3
  notes: >-
    The top three of a daily series, in order. Catches the three right days in date order.

- id: v2-h-list-003
  kind: hand
  family: list
  question: >-
    List the four pools from the lowest fee to the highest. Where two pools have the same fee,
    put the one whose label comes first alphabetically first. Give the labels.
  answer_type: list
  reference_sql: >-
