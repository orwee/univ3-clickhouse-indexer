# === HARD: comparing two periods =================================================================

- id: v2-h-period-compare-001
  kind: hand
  family: period-compare
  question: >-
    The wstETH/USDC 0.3% pool takes some share of the dollar volume of the wstETH/USDC pair
    (both fee tiers together). By how many percentage points did that share change from the
    week 2026-08-17 to 2026-08-23 to the week 2026-09-14 to 2026-09-20? Positive if it grew.
  answer_type: number
  unit: percentage points
  tolerance: {abs: "0.05", rel: "0.005"}
  reference_sql: >-
    SELECT 100 * sumIf(volume_usd, pool_label = 'wstETH/USDC 0.3%' AND block_date BETWEEN '2026-09-14' AND '2026-09-20')
               / sumIf(volume_usd, block_date BETWEEN '2026-09-14' AND '2026-09-20')
         - 100 * sumIf(volume_usd, pool_label = 'wstETH/USDC 0.3%' AND block_date BETWEEN '2026-08-17' AND '2026-08-23')
               / sumIf(volume_usd, block_date BETWEEN '2026-08-17' AND '2026-08-23') AS change
    FROM fct_pool_daily
    WHERE pool_address IN (SELECT pool_address FROM dim_pools WHERE token0 = 'wstETH' AND token1 = 'USDC')
  notes: >-
    Two shares and their difference in points. The tolerance has an absolute bound of its own
    because a difference of two shares can be close to zero. Catches a relative change in place
    of points, and a share of all pools in place of the pair.

- id: v2-h-period-compare-002
  kind: hand
  family: period-compare
  question: >-
    By what percent did the total number of swaps of all pools change from the week
    2026-09-07 to 2026-09-13 to the week 2026-09-14 to 2026-09-20? Answer in percent of the
    earlier week, negative if it fell.
  answer_type: number
  unit: percent
  tolerance: ratio
  reference_sql: >-
    SELECT 100 * (sumIf(swaps, block_date BETWEEN '2026-09-14' AND '2026-09-20')
                - sumIf(swaps, block_date BETWEEN '2026-09-07' AND '2026-09-13'))
          / sumIf(swaps, block_date BETWEEN '2026-09-07' AND '2026-09-13')
    FROM fct_pool_daily WHERE block_date BETWEEN '2026-09-07' AND '2026-09-20'
  notes: >-
    A relative change of a total between two periods. Catches the change in points and the
    change relative to the later week.

- id: v2-h-period-compare-003
  kind: hand
  family: period-compare
  question: >-
    Between 2026-09-01 and 2026-09-24, both days included, how many times more swaps per day did
    the USDC/WETH 0.01% pool have than the USDC/WETH 0.05% pool, on average? Answer as a ratio.
  answer_type: number
  unit: ratio
  tolerance: ratio
  reference_sql: >-
    SELECT sumIf(swaps, pool_label = 'USDC/WETH 0.01%') / sumIf(swaps, pool_label = 'USDC/WETH 0.05%')
    FROM fct_pool_daily WHERE block_date BETWEEN '2026-09-01' AND '2026-09-24'
  notes: >-
    Both pools have a row on all 24 days, so the ratio of the averages is the ratio of the sums.
    Catches a ratio of dollars in place of swaps.

- id: v2-h-period-compare-004
  kind: hand
  family: period-compare
  question: >-
    From the week 2026-08-17 to 2026-08-23 to the week 2026-09-14 to 2026-09-20, which pool's
    dollar volume grew the most in percent? Answer with the pool's label.
  answer_type: label
  reference_sql: >-
    SELECT pool_label FROM fct_pool_daily
    WHERE block_date BETWEEN '2026-08-17' AND '2026-09-20'
      AND (block_date <= '2026-08-23' OR block_date >= '2026-09-14')
    GROUP BY pool_label
    ORDER BY sumIf(volume_usd, block_date >= '2026-09-14') / sumIf(volume_usd, block_date <= '2026-08-23') DESC
    LIMIT 1
  notes: >-
    A relative change per pool and a maximum. The pool that grew the most in dollars is the
    largest pool, which is not the one that grew the most in percent.

- id: v2-h-period-compare-005
  kind: hand
  family: period-compare
  question: >-
    By what percent did the average swap size of the USDC/WETH 0.05% pool, in dollars, change
    from 2026-08-10 to 2026-08-31 to 2026-09-01 to 2026-09-24? Answer in percent of the earlier
    period's figure, negative if it fell.
  answer_type: number
  unit: percent
  tolerance: ratio
  reference_sql: >-
    SELECT 100 * (sumIf(volume_usd, block_date >= '2026-09-01') / sumIf(swaps, block_date >= '2026-09-01')
                / (sumIf(volume_usd, block_date <= '2026-08-31') / sumIf(swaps, block_date <= '2026-08-31')) - 1)
    FROM fct_pool_daily
    WHERE pool_label = 'USDC/WETH 0.05%' AND block_date BETWEEN '2026-08-10' AND '2026-09-24'
  notes: >-
    The average swap size of each period is total volume over total swaps, and the question asks
    for the relative change of the two. Catches a change of the totals.

- id: v2-h-period-compare-006
  kind: hand
  family: period-compare
  question: >-
    On how many days between 2026-08-10 and 2026-09-24, both included, was the total dollar
    volume of all pools higher than on the day before?
  answer_type: number
  unit: days
  tolerance: count
  reference_sql: >-
    SELECT count() FROM (
      SELECT block_date AS day, sum(volume_usd) AS total
      FROM fct_pool_daily WHERE block_date BETWEEN '2026-08-09' AND '2026-09-24' GROUP BY block_date) AS today
    INNER JOIN (
      SELECT block_date + 1 AS day, sum(volume_usd) AS before
      FROM fct_pool_daily WHERE block_date BETWEEN '2026-08-09' AND '2026-09-23' GROUP BY block_date) AS yesterday
    ON today.day = yesterday.day
    WHERE today.day >= '2026-08-10' AND today.total > yesterday.before
  notes: >-
    A day compared to the previous day, which needs a self-join or a window. The first day of
    the range is compared with 2026-08-09, the partial first day of the data. Catches a count of
    the days above the mean.

