    WHERE block_date BETWEEN '2026-09-01' AND '2026-09-24'
    GROUP BY pool_label ORDER BY sum(round_trip_volume_usd) / sum(volume_usd) DESC
  notes: >-
    A ratio of sums per pool, ranked. Catches a ranking by round-trip dollars, in which the
    biggest pool comes first whatever its share.

