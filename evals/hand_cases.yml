- id: u-other-chain-002
  kind: unanswerable
  family: other-chain
  question: How many swaps did the Uniswap v2 USDC/WETH pair have on 2026-08-19?
  notes: >-
    Another protocol version. The data holds v3 pools only. A wrong answer is the sum of
    the two v3 tiers.

- id: u-other-chain-003
  kind: unanswerable
