# Cases written by hand: thirty hard ones and thirty with no answer.
#
# Nothing in this file is an answer. A case with an answer holds a question and the query
# that answers it; `make golden` runs the query on the fixture and stores what came back.
# `accepted_sql` holds a query for each other reasonable reading of the question; when a
# reading gives another value it becomes an accepted answer, and when it gives the same
# value that shows the readings agree. A file that carries `expected` is refused.
#
# The data, for whoever reads the queries: four pools (USDC/WETH 0.05% and 0.01%,
# wstETH/USDC 0.05% and 0.3%); days 2026-08-09 to 2026-09-25, of which the first and the last
# are partial, so the complete days are 2026-08-10 to 2026-09-24; wstETH/USDC 0.3% has no row
# on 2026-08-15, a complete day, because it had no swap.

# --- several steps in one question ------------------------------------------------------------

- id: h-multi-step-001
  kind: hand
  family: multi-step
  question: >-
    Over the week from 2026-09-01 to 2026-09-07, both days included, which of the two
    USDC/WETH fee tiers had more dollar volume? Answer with the pool's label.
  answer_type: label
  reference_sql: >-
    SELECT pool_label FROM fct_pool_daily
    WHERE block_date BETWEEN '2026-09-01' AND '2026-09-07'
      AND pool_address IN (SELECT pool_address FROM dim_pools WHERE token0 = 'USDC' AND token1 = 'WETH')
    GROUP BY pool_label ORDER BY sum(volume_usd) DESC LIMIT 1
  notes: >-
    A filter on the pair, a sum per tier, then a comparison. Catches a model that compares
    one day, or that answers with a number.

- id: h-multi-step-002
  kind: hand
  family: multi-step
  question: >-
    The USDC/WETH 0.01% pool takes some share of the dollar volume of the USDC/WETH pair
    (both fee tiers together). By how many percentage points did that share change from the
    week 2026-08-10 to 2026-08-16 to the week 2026-09-14 to 2026-09-20? Positive if it grew.
  answer_type: number
  unit: percentage points
  tolerance: {abs: "0.05", rel: "0.005"}
  reference_sql: >-
    SELECT 100 * sumIf(volume_usd, pool_label = 'USDC/WETH 0.01%' AND block_date BETWEEN '2026-09-14' AND '2026-09-20')
               / sumIf(volume_usd, block_date BETWEEN '2026-09-14' AND '2026-09-20')
         - 100 * sumIf(volume_usd, pool_label = 'USDC/WETH 0.01%' AND block_date BETWEEN '2026-08-10' AND '2026-08-16')
               / sumIf(volume_usd, block_date BETWEEN '2026-08-10' AND '2026-08-16') AS change
    FROM fct_pool_daily
    WHERE pool_address IN (SELECT pool_address FROM dim_pools WHERE token0 = 'USDC' AND token1 = 'WETH')
  notes: >-
    Two shares, each a ratio of sums over a week, then their difference. Catches a relative
    change given in place of percentage points, and a share of all pools in place of the
    pair. The tolerance is its own: a difference of two shares can be close to zero, where a
    purely relative bound means nothing, so 0.05 percentage points absolute are allowed too.

- id: h-multi-step-003
  kind: hand
  family: multi-step
  question: >-
    Compare each pool's share of the total dollar volume of all four pools in August
    (2026-08-10 to 2026-08-31) with its share in September (2026-09-01 to 2026-09-24).
    Which pool's share grew the most, in percentage points? Answer with the pool's label.
  answer_type: label
  reference_sql: >-
    SELECT pool_label FROM fct_pool_daily
    WHERE block_date BETWEEN '2026-08-10' AND '2026-09-24'
    GROUP BY pool_label
    ORDER BY sumIf(volume_usd, block_date >= '2026-09-01')
               / (SELECT sum(volume_usd) FROM fct_pool_daily WHERE block_date BETWEEN '2026-09-01' AND '2026-09-24')
           - sumIf(volume_usd, block_date <= '2026-08-31')
               / (SELECT sum(volume_usd) FROM fct_pool_daily WHERE block_date BETWEEN '2026-08-10' AND '2026-08-31') DESC
    LIMIT 1
  notes: >-
    A share per pool in two periods, a difference, a maximum. Catches the pool whose volume
    grew the most in dollars or in relative terms, which is not the same pool as the one
    whose share grew the most in points.

- id: h-multi-step-004
  kind: hand
  family: multi-step
  question: >-
    In the week from 2026-09-08 to 2026-09-14, both days included, how many more US dollars
    of estimated fees did the 0.05% tier of USDC/WETH earn than the 0.01% tier?
  answer_type: number
  unit: USD
  tolerance: sum
  reference_sql: >-
    SELECT sumIf(fees_usd, pool_label = 'USDC/WETH 0.05%') - sumIf(fees_usd, pool_label = 'USDC/WETH 0.01%') AS more
    FROM fct_pool_daily
    WHERE block_date BETWEEN '2026-09-08' AND '2026-09-14'
  notes: >-
    Two sums and a difference, on fees and not on volume. Catches a difference of volumes
    and a fee recomputed with the wrong unit.

# --- units ------------------------------------------------------------------------------------

- id: h-units-001
  kind: hand
  family: units
  question: >-
    How many WETH were traded in the USDC/WETH 0.05% pool from 2026-09-01 to 2026-09-07,
    both days included? Answer in WETH, not in dollars.
  answer_type: number
  unit: WETH
  tolerance: quantity
  reference_sql: >-
    SELECT sum(if(p.token0 = 'WETH', d.volume_token0, d.volume_token1)) AS volume
    FROM fct_pool_daily AS d INNER JOIN dim_pools AS p ON p.pool_address = d.pool_address
    WHERE d.pool_label = 'USDC/WETH 0.05%' AND d.block_date BETWEEN '2026-09-01' AND '2026-09-07'
  notes: >-
    The answer is in a token. Catches the dollar volume, and the other token's column.

- id: h-units-002
  kind: hand
  family: units
  question: What is the swap fee of the wstETH/USDC 0.3% pool, in basis points?
  answer_type: number
  unit: basis points
  tolerance: count
  reference_sql: SELECT fee / 100 AS basis_points FROM dim_pools WHERE pool_label = 'wstETH/USDC 0.3%'
  notes: >-
    The fee column is in hundredths of a basis point. Catches the stored number given as it
    is, and the percentage given as basis points.

- id: h-units-003
  kind: hand
  family: units
  question: >-
    What fraction of the volume of each swap does the USDC/WETH 0.01% pool charge as a fee?
    Answer as a plain fraction, not in percent and not in basis points.
  answer_type: number
  unit: fraction
  tolerance: ratio
  reference_sql: SELECT fee_fraction FROM dim_pools WHERE pool_label = 'USDC/WETH 0.01%'
  notes: >-
    Three columns hold the same fee in three units. Catches the percentage given as a
    fraction, a factor of a hundred off.

- id: h-units-004
  kind: hand
  family: units
  question: >-
    What was the total dollar volume of all pools from 2026-08-10 to 2026-08-31, both days
    included, in millions of US dollars?
  answer_type: number
  unit: million USD
  tolerance: sum
  reference_sql: >-
    SELECT sum(volume_usd) / 1000000 AS millions FROM fct_pool_daily
    WHERE block_date BETWEEN '2026-08-10' AND '2026-08-31'
  notes: >-
    The figure is asked in millions. Catches the plain dollar amount, six orders of
    magnitude off.

# --- a pool named the other way round ---------------------------------------------------------

- id: h-reversed-name-001
  kind: hand
  family: reversed-name
  question: How many swaps did the WETH/USDC 0.05% pool have on 2026-08-19?
  answer_type: number
  unit: swaps
  tolerance: count
  reference_sql: >-
    SELECT swaps FROM fct_pool_daily WHERE pool_label = 'USDC/WETH 0.05%' AND block_date = '2026-08-19'
  notes: >-
    The label in the data is USDC/WETH 0.05%; the question names the same pool with the
    tokens swapped. Catches a refusal ("no such pool") and an empty result reported as zero.

- id: h-reversed-name-002
  kind: hand
  family: reversed-name
  question: What was the dollar volume, in US dollars, of the USDC/wstETH 0.3% pool on 2026-09-10?
  answer_type: number
  unit: USD
  tolerance: sum
  reference_sql: >-
    SELECT volume_usd FROM fct_pool_daily WHERE pool_label = 'wstETH/USDC 0.3%' AND block_date = '2026-09-10'
  notes: >-
    The label in the data is wstETH/USDC 0.3%. Catches a refusal, and the 0.05% tier of the
    same pair taken in its place.

- id: h-reversed-name-003
  kind: hand
  family: reversed-name
  question: How much USDC was traded in the WETH/USDC 0.01% pool on 2026-09-02? Answer in USDC.
  answer_type: number
  unit: USDC
  tolerance: quantity
  reference_sql: >-
    SELECT if(p.token0 = 'USDC', d.volume_token0, d.volume_token1) AS volume
    FROM fct_pool_daily AS d INNER JOIN dim_pools AS p ON p.pool_address = d.pool_address
    WHERE d.pool_label = 'USDC/WETH 0.01%' AND d.block_date = '2026-09-02'
  notes: >-
    The name is reversed and the answer is in a token. A model that trusts the order in the
    question takes USDC for token1 and returns the WETH volume.

# --- gross against net volume -----------------------------------------------------------------

- id: h-gross-net-001
  kind: hand
  family: gross-net
  question: >-
    What was the dollar volume of the USDC/WETH 0.01% pool from 2026-09-01 to 2026-09-07,
    both days included, excluding round trips? Answer in US dollars.
  answer_type: number
  unit: USD
  tolerance: sum
  reference_sql: >-
    SELECT sum(net_volume_usd) FROM fct_pool_daily_round_trips
    WHERE pool_label = 'USDC/WETH 0.01%' AND block_date BETWEEN '2026-09-01' AND '2026-09-07'
  notes: >-
    Says "excluding round trips": the net column. Catches the gross volume. Its pair is
    h-gross-net-002, the same question without those words.

- id: h-gross-net-002
  kind: hand
  family: gross-net
  question: >-
    What was the dollar volume of the USDC/WETH 0.01% pool from 2026-09-01 to 2026-09-07,
    both days included? Answer in US dollars.
  answer_type: number
  unit: USD
  tolerance: sum
  reference_sql: >-
    SELECT sum(volume_usd) FROM fct_pool_daily
    WHERE pool_label = 'USDC/WETH 0.01%' AND block_date BETWEEN '2026-09-01' AND '2026-09-07'
  notes: >-
    Does not mention round trips: the gross volume, which is what volume means everywhere
    in these tables. Catches a model that takes the net column because it exists.

- id: h-gross-net-003
  kind: hand
  family: gross-net
  question: >-
    How many US dollars of the volume of the USDC/WETH 0.05% pool on 2026-08-19 were round
    trips?
  answer_type: number
  unit: USD
  tolerance: sum
  reference_sql: >-
    SELECT round_trip_volume_usd FROM fct_pool_daily_round_trips
    WHERE pool_label = 'USDC/WETH 0.05%' AND block_date = '2026-08-19'
  notes: >-
    The part, not the whole and not the rest. Catches the net volume and the share given as
    dollars.

- id: h-gross-net-004
  kind: hand
  family: gross-net
  question: >-
    Across all four pools, from 2026-08-10 to 2026-09-24, both days included, what
    percentage of the dollar volume was round trips?
  answer_type: number
  unit: percent
  tolerance: ratio
  reference_sql: >-
    SELECT 100 * sum(round_trip_volume_usd) / sum(volume_usd) AS share
    FROM fct_pool_daily_round_trips WHERE block_date BETWEEN '2026-08-10' AND '2026-09-24'
  notes: >-
    A ratio of sums. Catches the average of the daily shares, which weighs a quiet day of a
    thin pool like a busy day of a deep one.

# --- more than one reasonable reading ---------------------------------------------------------

- id: h-ambiguous-001
  kind: hand
  family: ambiguous
  question: What was the total dollar volume of all pools in the last week of data? Answer in US dollars.
  answer_type: number
  unit: USD
  tolerance: sum
  reference_sql: >-
    SELECT sum(volume_usd) FROM fct_pool_daily WHERE block_date BETWEEN '2026-09-18' AND '2026-09-24'
  accepted_sql:
    - SELECT sum(volume_usd) FROM fct_pool_daily WHERE block_date BETWEEN '2026-09-19' AND '2026-09-25'
  notes: >-
    The last day, 2026-09-25, holds ten minutes of data. Two readings: the last seven
    complete days (expected) and the last seven days that have any row (accepted). Any
    other window is wrong.

- id: h-ambiguous-002
  kind: hand
  family: ambiguous
  question: How many swaps did the USDC/WETH 0.05% pool have on the first day of the data?
  answer_type: number
  unit: swaps
  tolerance: count
  reference_sql: >-
    SELECT swaps FROM fct_pool_daily WHERE pool_label = 'USDC/WETH 0.05%'
      AND block_date = (SELECT min(block_date) FROM fct_pool_daily)
  accepted_sql:
    - SELECT swaps FROM fct_pool_daily WHERE pool_label = 'USDC/WETH 0.05%' AND block_date = '2026-08-10'
  notes: >-
    The first day with a row is 2026-08-09 and it is partial. Expected: that day, as the
    question literally asks. Accepted: the first complete day, 2026-08-10. Nothing in the
    marts says a day is partial, so the literal reading is the one a careful reader of the
    schema reaches.

- id: h-ambiguous-003
  kind: hand
  family: ambiguous
  question: >-
    What was the average daily dollar volume of the USDC/WETH 0.05% pool in September 2026?
    Answer in US dollars per day.
  answer_type: number
  unit: USD per day
  tolerance: sum
  reference_sql: >-
    SELECT sum(volume_usd) / count() FROM fct_pool_daily
    WHERE pool_label = 'USDC/WETH 0.05%' AND block_date BETWEEN '2026-09-01' AND '2026-09-24'
  accepted_sql:
    - >-
      SELECT sum(volume_usd) / count() FROM fct_pool_daily
      WHERE pool_label = 'USDC/WETH 0.05%' AND block_date BETWEEN '2026-09-01' AND '2026-09-30'
  notes: >-
    The data stops on 2026-09-25, a partial day. Expected: the mean over the 24 complete
    days of September. Accepted: the mean over the 25 days that have a row. Dividing by 30
    is wrong: five days of the month are not in the data.

- id: h-ambiguous-004
  kind: hand
  family: ambiguous
  question: Which pool had the most swaps in the last week of data? Answer with the pool's label.
  answer_type: label
  reference_sql: >-
    SELECT pool_label FROM fct_pool_daily WHERE block_date BETWEEN '2026-09-18' AND '2026-09-24'
    GROUP BY pool_label ORDER BY sum(swaps) DESC LIMIT 1
  accepted_sql:
    - >-
      SELECT pool_label FROM fct_pool_daily WHERE block_date BETWEEN '2026-09-19' AND '2026-09-25'
      GROUP BY pool_label ORDER BY sum(swaps) DESC LIMIT 1
  notes: >-
    The same two readings of "the last week" as h-ambiguous-001. Here both queries give the
    same pool, so there is one answer and nothing is listed as accepted: the second query
    is there to show it.

# --- an answer that is a list in order --------------------------------------------------------

- id: h-ordered-list-001
  kind: hand
  family: ordered-list
  question: >-
    Between 2026-08-10 and 2026-09-24, which were the three days with the highest total
    dollar volume across all pools? List the dates, highest volume first.
  answer_type: list
  reference_sql: >-
    SELECT toString(block_date) FROM fct_pool_daily WHERE block_date BETWEEN '2026-08-10' AND '2026-09-24'
    GROUP BY block_date ORDER BY sum(volume_usd) DESC LIMIT 3
  notes: >-
    Three dates in order. Catches the right days in the wrong order, and the top days of
    one pool in place of all pools.

- id: h-ordered-list-002
  kind: hand
  family: ordered-list
  question: >-
    Rank the four pools by number of swaps from 2026-09-01 to 2026-09-24, both days
    included. List their labels, most swaps first.
  answer_type: list
  reference_sql: >-
    SELECT pool_label FROM fct_pool_daily WHERE block_date BETWEEN '2026-09-01' AND '2026-09-24'
    GROUP BY pool_label ORDER BY sum(swaps) DESC
  notes: >-
    Four labels in order. Catches a ranking by dollar volume, which puts the two USDC/WETH
    tiers the other way round.

- id: h-ordered-list-003
  kind: hand
  family: ordered-list
  question: >-
    Which were the three days with the most swaps in the wstETH/USDC 0.05% pool between
    2026-08-10 and 2026-09-24? List the dates, most swaps first.
  answer_type: list
  reference_sql: >-
    SELECT toString(block_date) FROM fct_pool_daily
    WHERE pool_label = 'wstETH/USDC 0.05%' AND block_date BETWEEN '2026-08-10' AND '2026-09-24'
    ORDER BY swaps DESC LIMIT 3
  notes: >-
    The same shape on a thin pool, by swaps and not by volume. Catches the days with the
    most volume.

# --- a pool-day inside the window with no row -------------------------------------------------

- id: h-missing-row-001
  kind: hand
  family: missing-row
  question: How many swaps did the wstETH/USDC 0.3% pool have on 2026-08-15?
  answer_type: number
  unit: swaps
  tolerance: count
  reference_sql: >-
    SELECT sum(swaps) FROM fct_pool_daily WHERE pool_label = 'wstETH/USDC 0.3%' AND block_date = '2026-08-15'
  notes: >-
    There is no row for that pool on that day, and the day is complete and inside the data:
    the pool had no swap. The answer is 0. A refusal is wrong here, and so is "no data".

- id: h-missing-row-002
  kind: hand
  family: missing-row
  question: What was the dollar volume, in US dollars, of the wstETH/USDC 0.3% pool on 2026-08-15?
  answer_type: number
  unit: USD
  tolerance: sum
  reference_sql: >-
    SELECT coalesce(sum(volume_usd), 0) FROM fct_pool_daily
    WHERE pool_label = 'wstETH/USDC 0.3%' AND block_date = '2026-08-15'
  notes: >-
    The same missing row, asked as a volume. The sum over no rows is NULL in this column,
    and NULL is not the answer: no swaps means zero dollars. Catches a refusal and a NULL
    passed on.

- id: h-missing-row-003
  kind: hand
  family: missing-row
  question: >-
    How many swaps did the wstETH/USDC 0.3% pool have from 2026-08-14 to 2026-08-16, both
    days included?
  answer_type: number
  unit: swaps
  tolerance: count
  reference_sql: >-
    SELECT sum(swaps) FROM fct_pool_daily
    WHERE pool_label = 'wstETH/USDC 0.3%' AND block_date BETWEEN '2026-08-14' AND '2026-08-16'
  notes: >-
    A range with a missing day in the middle. The sum over the two days that have a row is
    the answer. Catches a refusal because a day is missing.

- id: h-missing-row-004
  kind: hand
  family: missing-row
  question: >-
    On how many days from 2026-08-10 to 2026-09-24, both included, did the wstETH/USDC 0.3%
    pool have no swap at all?
  answer_type: number
  unit: days
  tolerance: count
  reference_sql: >-
    SELECT dateDiff('day', toDate('2026-08-10'), toDate('2026-09-24')) + 1 - count() AS days
    FROM fct_pool_daily
    WHERE pool_label = 'wstETH/USDC 0.3%' AND block_date BETWEEN '2026-08-10' AND '2026-09-24'
  notes: >-
    A count of what is not there. Counting rows where swaps = 0 gives zero, because a day
    without swaps has no row. The days have to be counted against the calendar.

# --- dates ------------------------------------------------------------------------------------

- id: h-dates-001
  kind: hand
  family: dates
  question: >-
    Between 2026-08-10 and 2026-09-24, on which day of the week did the USDC/WETH 0.05%
    pool have its single highest daily dollar volume? Answer with the weekday's English name.
  answer_type: label
  reference_sql: >-
    SELECT dateName('weekday', block_date) FROM fct_pool_daily
    WHERE pool_label = 'USDC/WETH 0.05%' AND block_date BETWEEN '2026-08-10' AND '2026-09-24'
    ORDER BY volume_usd DESC LIMIT 1
  notes: >-
    The weekday of one day, not the weekday with the highest total. Catches a date given in
    place of a weekday, and a weekday worked out by the model and not by the database.

- id: h-dates-002
  kind: hand
  family: dates
  question: >-
    On how many days from 2026-08-10 to 2026-09-24, both included, did the USDC/WETH 0.01%
    pool have more than 20,000 swaps?
  answer_type: number
  unit: days
  tolerance: count
  reference_sql: >-
    SELECT count() FROM fct_pool_daily
    WHERE pool_label = 'USDC/WETH 0.01%' AND block_date BETWEEN '2026-08-10' AND '2026-09-24' AND swaps > 20000
  notes: >-
    A count of days that meet a condition. Catches the number of swaps on those days, and
    "at least" taken for "more than".

- id: h-dates-003
  kind: hand
  family: dates
  question: >-
    From 2026-08-10 on, what was the first day on which the wstETH/USDC 0.05% pool had more
    than 20,000 US dollars of volume? Answer with the date.
  answer_type: date
  reference_sql: >-
    SELECT min(block_date) FROM fct_pool_daily
    WHERE pool_label = 'wstETH/USDC 0.05%' AND block_date >= '2026-08-10' AND volume_usd > 20000
  notes: >-
    The first day something happened. Catches the day with the highest volume, which is a
    later one, and the last day over the threshold.

- id: h-dates-004
  kind: hand
  family: dates
  question: >-
    On how many days from 2026-08-10 to 2026-09-24, both included, did the USDC/WETH 0.01%
    pool have more dollar volume than the USDC/WETH 0.05% pool?
  answer_type: number
  unit: days
  tolerance: count
  reference_sql: >-
    SELECT countIf(low > high) FROM (
      SELECT block_date,
             sumIf(volume_usd, pool_label = 'USDC/WETH 0.01%') AS low,
             sumIf(volume_usd, pool_label = 'USDC/WETH 0.05%') AS high
      FROM fct_pool_daily WHERE block_date BETWEEN '2026-08-10' AND '2026-09-24' GROUP BY block_date)
  notes: >-
    Two pools compared day by day, then counted. Catches a comparison of the two totals,
    which answers yes or no and not a number of days.

# === cases with no answer =======================================================================

# --- a pool or a pair that is not in the data -------------------------------------------------

- id: u-not-in-data-001
  kind: unanswerable
  family: not-in-data
  question: What was the dollar volume of the WBTC/USDC 0.3% pool on 2026-09-01?
  notes: >-
    No such pair in the data. A wrong answer is 0, as if the pool existed and did not trade,
    or the volume of another pool.

- id: u-not-in-data-002
  kind: unanswerable
  family: not-in-data
  question: How many swaps did the USDC/WETH 0.3% pool have on 2026-08-19?
  notes: >-
    The pair is in the data, this fee tier is not: only 0.05% and 0.01%. A wrong answer is
    the swaps of one of those two tiers, or of wstETH/USDC 0.3%, which shares the tier.

- id: u-not-in-data-003
  kind: unanswerable
  family: not-in-data
  question: What was the volume-weighted average price of DAI in the DAI/USDC 0.01% pool on 2026-09-10?
  notes: >-
    DAI is in no pool here. A wrong answer is 1, from general knowledge of a stablecoin.

- id: u-not-in-data-004
  kind: unanswerable
  family: not-in-data
  question: How much wstETH was traded against WETH in the wstETH/WETH 0.01% pool in September 2026?
  notes: >-
    Both tokens are in the data, in other pools; this pair is not. A wrong answer adds the
    wstETH volume of the wstETH/USDC pools.

