# --- sounds answerable from a column that looks right and is not ------------------------------

- id: u-legs-trap-001
  kind: unanswerable
  family: legs-trap
  question: How many distinct senders swapped in the USDC/WETH 0.05% pool on 2026-08-19?
  notes: >-
    The legs table has a sender column and a pool and a date, so the query runs. But it
    holds only the legs of round trips, a small part of all swaps. A wrong answer is
    uniq(sender) from that table, reported as all senders.

- id: u-legs-trap-002
  kind: unanswerable
  family: legs-trap
  question: What was the largest single swap, in US dollars, in the USDC/WETH 0.01% pool on 2026-09-11?
  notes: >-
    The only table with one row per swap is the legs table, and it has only round-trip legs.
    A wrong answer is max(volume_usd) of the legs, which is the largest round-trip leg.

- id: u-legs-trap-003
  kind: unanswerable
  family: legs-trap
  question: In how many different transactions were there swaps in the wstETH/USDC 0.05% pool on 2026-09-11?
  notes: >-
    Transaction hashes exist only in the legs table. A wrong answer is uniq(tx_hash) there,
    the transactions with a round-trip leg.

- id: u-legs-trap-004
  kind: unanswerable
  family: legs-trap
  question: At what time, in UTC, did the last swap of 2026-08-19 happen in the USDC/WETH 0.05% pool?
  notes: >-
    Timestamps exist only in the legs table. A wrong answer is max(block_timestamp) there,
    the time of the last round-trip leg.

- id: u-legs-trap-005
  kind: unanswerable
  family: legs-trap
  question: Which sender address accounted for the most dollar volume in USDC/WETH 0.05% during September 2026?
  notes: >-
    A wrong answer is the top sender of the legs table, which ranks senders by their round
    trips only.
