version: 2

seeds:
  - name: pools
    description: >
      pools.yml as a table. GENERATED by scripts/generate_pools_seed.py; a pytest test
      fails if the two diverge. Addresses are lower-case here, to match the raw table.
    columns:
      - name: pool_address
        description: "Lower-case. String, not Nullable: not_default, because not_null cannot fail here."
        tests: [unique, not_default]
      - name: fee
        description: Fee in hundredths of a basis point (500 = 0.05%). fee / 1e6 is the fraction.
        tests:
          - accepted_values:
              arguments:
                values: [100, 500, 3000, 10000]
                quote: false

models:
  - name: stg_swaps
    description: >
      One row per swap, readable: hex hashes, UTC date, exact Decimal amounts next to the
      raw integers, and volume_usd from the stablecoin leg (NULL without one).
    tests:
      - unique_combination:
          arguments:
            columns: [block_number, log_index]
    columns:
      # Only volume_usd is Nullable in this model. On every other column not_null could never
      # fail in ClickHouse, and a relationships test to the seed could not either, because the
      # model INNER JOINs that seed: those tests were removed. What replaced them looks at
      # the source (assert_every_raw_pool_is_in_the_seed), at the type default (not_default)
      # and at the content (the singular tests in dbt/tests/).
      - name: pool_address
      - name: block_number
      - name: log_index
      - name: block_timestamp
        description: UTC. 1970-01-01 would mean a log that was landed without its timestamp.
        tests: [not_default]
      - name: block_date
        description: UTC calendar day of the block.
      - name: tx_hash
        description: "'0x' + 64 lower-case hex characters (assert_hashes_and_addresses_are_well_formed)."
      - name: amount0_raw
        description: Signed Int256 exactly as emitted. Positive = the pool received it.
      - name: amount1_raw
      - name: amount0
        description: >
          amount0_raw divided by 10^decimals0, as an exact Decimal(76, 18). Never a float.
          Zero is legitimate (dust swaps), so there is no not_default here;
          assert_scaled_amounts_lose_no_digits checks the scaling.
      - name: amount1
      - name: amount0_abs
      - name: amount1_abs
      - name: volume_usd
        description: >
          Absolute value of the stablecoin leg (symbols in the stablecoin_symbols var).
          NULL when the pool has no stablecoin. Every pool in pools.yml today has USDC, so
          not_null is asserted here on purpose: it will fail, loudly, the day a pool
          without a stablecoin is added, and that is the moment to decide what to do.
        tests: [not_null]
