version: 2

# In ClickHouse a column is Nullable only if its type says so. not_null is kept ONLY on the
# columns that are (volume_usd, fees_usd, smart_money_share_of_volume_usd); everywhere else
# it could never fail and was removed, together with the relationships tests to a dimension
# the models INNER JOIN and the non_negative tests on unsigned integers and sums of abs().
# scripts/prove_dbt_tests_can_fail.py breaks the data on purpose and shows each remaining
# test failing.

models:
  - name: dim_pools
    description: One row per pool, from the seed generated out of pools.yml.
    columns:
      - name: pool_address
        tests: [unique]
      - name: pool_label
        description: Hand-written in pools.yml. assert_pool_label_states_its_fee_tier checks it against fee.
        tests: [unique, not_default]
      - name: fee
      - name: fee_fraction
        description: fee / 1e6, exact Decimal. 0.0005 for the 0.05% tier.

  - name: fct_pool_daily
    description: >
      Daily activity per pool: swaps, volume of each token, volume_usd and estimated
      fees_usd. Carries pool_label and fee denormalised on purpose (see the model).
      assert_mart_accounts_for_every_raw_swap compares it with the raw source, and
      assert_denormalised_copies_match_the_dimension with dim_pools.
    tests:
      - unique_combination:
          arguments:
            columns: [pool_address, block_date]
    columns:
      - name: pool_address
      - name: block_date
      - name: pool_label
        tests: [not_default]
      - name: fee
      - name: swaps
      - name: volume_token0
      - name: volume_token1
      - name: volume_usd
        description: "Sum of the stablecoin leg. Nullable: NULL for a pool without a stablecoin."
        tests: [not_null]
      - name: fees_usd
        description: volume_usd * fee / 1e6. An estimate; see the model header. Nullable.
        tests: [not_null]

  - name: fct_pool_daily_smart_money
    description: >
      Per pool and UTC day that was fetched from the Nansen API: our swaps and USD volume, the
      part that sits in transactions of smart-money traders, and both shares. Aggregates only.
      Empty when the Nansen aggregate was never computed (no API key).
      assert_smart_money_is_a_part_of_the_pool_day checks the ranges.
    tests:
      - unique_combination:
          arguments:
            columns: [pool_address, block_date]
    columns:
      - name: pool_address
      - name: block_date
      - name: smart_money_swaps
      - name: smart_money_share_of_swaps
        description: smart_money_swaps / swaps, between 0 and 1.
      - name: smart_money_share_of_volume_usd
        description: >
          smart_money_volume_usd / volume_usd (stablecoin leg at 1 USD), between 0 and 1.
          Nullable, because volume_usd is.
        tests: [not_null]

  - name: fct_round_trip_legs
    description: >
      Every swap that is a leg of a same-block round trip, one row per swap: same pool, same
      block, same sender, opposite direction, the second undoing 90% to 110% of the first on
      the non-stable leg (the definition of sql/reconciliation/16_evidence_round_trips.sql).
      Consistent with a sandwich pattern; nothing here observes intent.
      assert_round_trip_legs_match_their_definition recomputes it from the raw table.
    tests:
      - unique_combination:
          arguments:
            columns: [pool_address, block_number, log_index]
    columns:
      - name: pool_address
      - name: block_number
      - name: log_index
      - name: block_date
      - name: sender
        description: The contract that called the pool, not the account that signed.
      - name: pairs_opened
        description: Pairs in which this swap is the first leg.
      - name: pairs_closed
        description: Pairs in which this swap is the second leg.
      - name: in_a_one_transaction_pair
        description: At least one of its pairs has both legs in the same transaction.
      - name: volume_usd
        description: "The stablecoin leg of this swap, as in stg_swaps. Nullable."

  - name: fct_pool_daily_round_trips
    description: >
      Per pool and UTC day, every pool-day of fct_pool_daily: how many round trips, how many
      swaps and how much USD they hold, and the volume left without them.
      assert_round_trips_are_a_part_of_the_pool_day checks the ranges and the coverage.
    tests:
      - unique_combination:
          arguments:
            columns: [pool_address, block_date]
    columns:
      - name: pool_address
      - name: block_date
      - name: pool_label
        tests: [not_default]
      - name: swaps
      - name: volume_usd
        description: As in fct_pool_daily. Nullable.
      - name: round_trips
        description: Pairs, as defined in fct_round_trip_legs.
      - name: round_trip_swaps
        description: Distinct swaps in those pairs, each counted once.
      - name: round_trip_swaps_in_one_transaction
      - name: round_trip_volume_usd
        description: USD of those swaps, both legs, each swap once.
      - name: net_volume_usd
        description: volume_usd minus round_trip_volume_usd. Nullable, because volume_usd is.
      - name: round_trip_share_of_volume_usd
        description: round_trip_volume_usd / volume_usd, 0 when volume_usd is 0.
